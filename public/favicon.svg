<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#2563eb" stroke="#1e40af" stroke-width="2"/>
  
  <!-- Book/ledger icon -->
  <g transform="translate(50, 50)">
    <!-- Book pages -->
    <rect x="-20" y="-22" width="40" height="44" rx="2" fill="#ffffff"/>
    
    <!-- Book spine -->
    <rect x="-20" y="-22" width="4" height="44" fill="#dbeafe"/>
    
    <!-- Horizontal lines representing text -->
    <line x1="-12" y1="-14" x2="14" y2="-14" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-12" y1="-6" x2="14" y2="-6" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-12" y1="2" x2="14" y2="2" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="-12" y1="10" x2="14" y2="10" stroke="#93c5fd" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Checkmark overlay (representing completed interactions) -->
    <g transform="translate(8, 8)">
      <circle cx="0" cy="0" r="10" fill="#10b981" opacity="0.95"/>
      <path d="M -3 0 L -1 3 L 4 -4" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>
</svg>
